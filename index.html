<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena NOVA · Votação</title>
<style>
:root{--bg:#060f18;--card:#0f2234;--line:#ffffff24;--tx:#fff;--mut:#b9d3e4;--teal:#69C3D7;--pink:#ff7aa0;--org:#ffb36b;--ok:#50AA73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"TT Norms Pro","TT Norms",Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(ellipse 120% 60% at 80% -10%,#3b2f77aa 0,transparent 60%),radial-gradient(ellipse 100% 50% at 0% 100%,#1783c955 0,transparent 60%),var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.brand{text-align:center;margin:6px 0 18px}
.brand small{display:block;letter-spacing:.32em;font-size:12px;color:var(--mut);text-transform:uppercase}
.brand h1{margin:8px 0 2px;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.01em}
.brand h1 span{background:linear-gradient(90deg,var(--teal),var(--pink),var(--org));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:6px 0 0;color:var(--mut);font-size:15px}
.card{background:linear-gradient(135deg,#0f2234ee,#0a1b2cdd);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0006}
.card h2{margin:0 0 4px;font-size:18px;line-height:1.25}
.card .ap{color:var(--org);font-size:14px;margin-bottom:12px}
.names{display:grid;gap:10px;margin-top:6px}
.name{appearance:none;border:1px solid var(--line);background:#ffffff0a;color:#fff;border-radius:14px;padding:16px;font:inherit;font-size:17px;font-weight:700;text-align:left;cursor:pointer}
.name:active{transform:scale(.985);background:#ffffff18}
label.cod{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
input.cod{width:100%;margin-top:6px;padding:14px;border-radius:12px;border:1px solid var(--line);background:#00000040;color:#fff;font:inherit;font-size:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.who{font-size:15px;color:var(--mut)}
.who b{color:#fff}
.link{background:none;border:0;color:var(--teal);font:inherit;font-size:14px;text-decoration:underline;padding:6px}
.prog{height:8px;border-radius:99px;background:#ffffff1a;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--pink),var(--org));transition:width .4s}
.cnt{font-size:13px;color:var(--mut);margin-bottom:6px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:#ffffff0c;color:#fff;border-radius:12px;min-height:48px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;touch-action:manipulation}
.chip:active{transform:scale(.96)}
.chip.sel{background:linear-gradient(135deg,#ff7aa0,#ffb36b);border-color:transparent;color:#0a1b2c}
.chip.busy{opacity:.55}
.link.novo{display:block;margin:14px auto 0}
.state{margin-top:10px;font-size:14px;min-height:20px;color:var(--mut)}
.state.ok{color:var(--ok)}.state.err{color:#ff8a8a}
.done{text-align:center;padding:18px 10px}
.done .big{font-size:22px;font-weight:800;margin-bottom:6px}
.resumo{margin:12px 0 0;padding:0;list-style:none;text-align:left}
.resumo li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.resumo li b{color:var(--org);white-space:nowrap}
.fechada{text-align:center;padding:26px 14px}
.fechada .big{font-size:22px;font-weight:800;margin-bottom:8px}
.foot{margin-top:18px;text-align:center;color:#ffffff88;font-size:13px;line-height:1.5}
.toast{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));max-width:528px;margin:0 auto;padding:14px 16px;border-radius:14px;background:#7a2231;color:#fff;font-size:15px;box-shadow:0 8px 24px #0008;display:none;z-index:9}
.load{text-align:center;color:var(--mut);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <small>Semana de Inteligência Digital Hcor</small>
    <h1>Arena <span>NOVA</span></h1>
    <p>Votação dos jurados</p>
  </div>
  <div id="app"><div class="load">Carregando…</div></div>
  <div class="foot">Suas notas são gravadas na hora.<br>Você pode alterá-las enquanto a votação estiver aberta.</div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var app = document.getElementById('app'), toastEl = document.getElementById('toast');
  var S = { init: null, juror: '', code: '', votes: {}, busy: {} };
  var KEY = 'arenaNovaJurado';

  function fmt(n) { return String(n).replace('.', ','); }
  function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function msg(e) { return (e && e.message) ? e.message.replace(/^Error:\s*/, '') : 'Algo deu errado. Tente de novo.'; }
  function toast(t) { toastEl.textContent = t; toastEl.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { toastEl.style.display = 'none'; }, 4500); }
  // Fala com a planilha pelo endereço do app do Google (JSON, sem login, sem cookies)
  var API = 'https://script.google.com/macros/s/AKfycbwBoF371uLva4A-Vct6LIp7qcH_cMUK_y5F0Yqm0_5NE1HLvDSwtaOCE5sYNLDsY3WxFA/exec';
  var ROTAS = {
    getInit: ['init'],
    getMeusVotos: ['meus', 'jurado', 'codigo'],
    salvarVoto: ['votar', 'jurado', 'projeto', 'nota', 'codigo'],
    cadastrarJurado: ['cadastrar', 'nome', 'codigo'],
    adminEstado: ['admin_estado', 'senha'],
    adminAcao: ['admin_acao', 'senha', 'acao2'],
    adminApagar: ['admin_apagar', 'senha', 'jurado'],
    adminJurado: ['admin_jurado', 'senha', 'op', 'nome']
  };
  function call(fn, args, ok, fail) {
    var falha = fail || function (x) { toast(msg(x)); };
    var r = ROTAS[fn], q = 'acao=' + r[0];
    for (var i = 1; i < r.length; i++) { q += '&' + r[i] + '=' + encodeURIComponent(args[i - 1] === undefined || args[i - 1] === null ? '' : args[i - 1]); }
    var tentativas = 0;
    (function tentar() {
      tentativas++;
      fetch(API + '?' + q + '&_=' + Date.now(), { method: 'GET', redirect: 'follow', cache: 'no-store', credentials: 'omit' })
        .then(function (res) { return res.json(); })
        .then(function (j) { if (j && j.ok) { ok(j.dados); } else { falha(new Error((j && j.erro) || 'Não foi possível concluir.')); } })
        .catch(function () {
          if (tentativas < 3) { setTimeout(tentar, 700 * tentativas); }   // rede instável: tenta de novo sozinho
          else { falha(new Error('Sem conexão com a votação. Confira a internet e tente de novo.')); }
        });
    })();
  }

  function start() {
    call('getInit', [], function (init) {
      S.init = init;
      var saved = '';
      try { saved = localStorage.getItem(KEY) || ''; } catch (e) {}
      if (saved && init.jurados.indexOf(saved) >= 0 && !init.exigeCodigo) { entrar(saved); } else { telaNomes(); }
    }, function (e) { app.innerHTML = '<div class="card fechada"><div class="big">Não consegui abrir</div><div>' + esc(msg(e)) + '</div></div>'; });
  }

  function telaNomes(erro) {
    var i = S.init;
    if (!i.aberta) { return telaFechada(); }
    var h = '<div class="card"><h2>Quem está votando?</h2><div class="ap" style="color:var(--mut)">Toque no seu nome.</div>';
    if (i.exigeCodigo) { h += '<label class="cod">Código de acesso<input class="cod" id="cod" inputmode="numeric" autocomplete="off" value="' + esc(S.code) + '"></label>'; }
    h += '<div class="names">' + i.jurados.map(function (n, k) { return '<button class="name" data-k="' + k + '">' + esc(n) + '</button>'; }).join('') + '</div>';
    if (i.permiteNovo) { h += '<button class="link novo" id="novo">Meu nome não está na lista</button>'; }
    if (erro) { h += '<div class="state err">' + esc(erro) + '</div>'; }
    h += '</div><button class="link novo" id="adm" style="opacity:.55;font-size:12px">Administração</button>';
    app.innerHTML = h;
    document.getElementById('adm').onclick = function () { telaAdminLogin(); };
    if (i.permiteNovo) { document.getElementById('novo').onclick = function () { if (i.exigeCodigo) { S.code = document.getElementById('cod').value; } telaCadastro(); }; }
    [].forEach.call(app.querySelectorAll('.name'), function (b) {
      b.onclick = function () {
        if (i.exigeCodigo) { S.code = document.getElementById('cod').value; }
        entrar(i.jurados[+b.getAttribute('data-k')]);
      };
    });
  }

  // ---- Administração (senha conferida no servidor): controlar a votação e apagar notas de teste ----
  function telaAdminLogin(erro) {
    var h = '<div class="card"><h2>Administração</h2><div class="ap" style="color:var(--mut)">Digite a senha para controlar a votação.</div>' +
      '<label class="cod">Senha<input class="cod" id="admSenha" type="password" autocomplete="off"></label>' +
      '<div class="names" style="margin-top:14px"><button class="name" id="admOk">Entrar</button></div><button class="link novo" id="admVolta">Voltar</button>';
    if (erro) { h += '<div class="state err">' + esc(erro) + '</div>'; }
    app.innerHTML = h + '</div>';
    document.getElementById('admVolta').onclick = function () { telaNomes(); };
    var campo = document.getElementById('admSenha'), entrarAdm = function () {
      var b = document.getElementById('admOk'); b.textContent = 'Conferindo…'; b.disabled = true; S.adm = campo.value;
      call('adminEstado', [S.adm], function (e) { telaAdmin(e); }, function (e) { S.adm = ''; telaAdminLogin(msg(e)); });
    };
    document.getElementById('admOk').onclick = entrarAdm;
    campo.onkeydown = function (ev) { if (ev.key === 'Enter') { entrarAdm(); } };
  }
  function telaAdmin(est, aviso) {
    var lista = est.lista || [];
    var btn = 'min-height:44px;padding:0 14px;font-size:15px;width:100%;margin-top:8px';
    var h = '<div class="card"><h2>Controle da votação</h2><ul class="resumo">' +
      '<li><span>Votação</span><b>' + (est.aberta ? 'ABERTA' : 'ENCERRADA') + '</b></li>' +
      '<li><span>Placar ao vivo no telão</span><b>' + (est.aoVivo ? 'LIGADO' : 'desligado') + '</b></li>' +
      '<li><span>Resultado final no telão</span><b>' + (est.liberado ? 'LIBERADO' : 'oculto') + '</b></li></ul>' +
      (est.aberta ? '<button class="chip" data-a="encerrar" style="' + btn + '">Encerrar votação</button>' : '<button class="chip sel" data-a="abrir" style="' + btn + '">Iniciar votação</button>') +
      '<button class="chip" data-a="' + (est.aoVivo ? 'aovivo_off' : 'aovivo_on') + '" style="' + btn + '">' + (est.aoVivo ? 'Desligar placar ao vivo' : 'Ligar placar ao vivo') + '</button>' +
      (est.liberado ? '<button class="chip" data-a="ocultar" style="' + btn + '">Ocultar resultado do telão</button>' :
        (est.aberta ? '<div class="cnt" style="margin-top:8px">Para liberar o resultado final, encerre a votação antes.</div>' : '<button class="chip sel" data-a="liberar" style="' + btn + '">Liberar resultado no telão</button>')) +
      '</div>';
    h += '<div class="card"><h2>Quem já votou</h2><div class="ap" style="color:var(--mut)">Apagar as notas de um jurado libera ele para votar de novo.</div>';
    if (!lista.length) { h += '<div class="state">Nenhum voto registrado.</div>'; }
    lista.forEach(function (j, k) {
      h += '<div style="border-top:1px solid var(--line);padding:10px 0"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>' + esc(j.jurado) + '</b><div class="cnt" style="margin:2px 0 0">' + j.votos + (j.votos === 1 ? ' nota' : ' notas') + ': ' +
        j.notas.map(function (n) { return esc(n.id) + '=' + fmt(n.nota); }).join(' · ') + '</div></div><button class="chip" data-k="' + k + '" style="min-height:40px;padding:0 14px;font-size:14px">Apagar</button></div></div>';
    });
    if (lista.length) { h += '<button class="link novo" id="admTodos" style="color:#ff8a8a">Apagar os votos de todos</button>'; }
    h += '</div><div class="card"><h2>Avaliadores</h2><div class="ap" style="color:var(--mut)">Quem aparece na lista de nomes do jurado. Excluir também apaga as notas da pessoa.</div>';
    var jur = est.jurados || [];
    jur.forEach(function (n, k) {
      h += '<div style="border-top:1px solid var(--line);padding:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center"><b>' + esc(n) + '</b><button class="chip" data-j="' + k + '" style="min-height:40px;padding:0 14px;font-size:14px">Excluir</button></div>';
    });
    h += '<label class="cod" style="margin-top:10px">Incluir avaliador<input class="cod" id="admNovo" type="text" placeholder="Nome completo" autocomplete="off"></label>' +
      '<button class="chip sel" id="admAdd" style="' + btn + '">Incluir</button>';
    if (aviso) { h += '<div class="state ok">' + esc(aviso) + '</div>'; }
    h += '<button class="link novo" id="admSai">Sair da administração</button></div>';
    app.innerHTML = h;
    var ok = function (e, m) { S.init.aberta = e.aberta; telaAdmin(e, m); };
    var apagar = function (nome, rotulo) {
      if (!window.confirm('Apagar ' + rotulo + '? Não dá para desfazer.')) { return; }
      call('adminApagar', [S.adm, nome], function (e) { ok(e, 'Apagado. ' + (nome === '*' ? 'Todos podem votar de novo.' : nome + ' pode votar de novo.')); }, function (e) { toast(msg(e)); });
    };
    var CONF = { encerrar: 'Encerrar a votação? Ninguém mais conseguirá votar.', abrir: 'Iniciar a votação? Os jurados poderão votar, a música começa no telão e o resultado final fica oculto.', liberar: 'Liberar o resultado final no telão?' };
    var MSG = { encerrar: 'Votação encerrada.', abrir: 'Votação iniciada.', aovivo_on: 'Placar ao vivo ligado.', aovivo_off: 'Placar ao vivo desligado.', liberar: 'Resultado liberado no telão.', ocultar: 'Resultado oculto.' };
    [].forEach.call(app.querySelectorAll('.chip[data-a]'), function (b) {
      b.onclick = function () {
        var a = b.getAttribute('data-a');
        if (CONF[a] && !window.confirm(CONF[a])) { return; }
        b.disabled = true; b.textContent = 'Aguarde…';
        call('adminAcao', [S.adm, a], function (e) { ok(e, MSG[a]); }, function (e) { toast(msg(e)); telaAdmin(est); });
      };
    });
    [].forEach.call(app.querySelectorAll('.chip[data-k]'), function (b) { b.onclick = function () { var j = lista[+b.getAttribute('data-k')]; apagar(j.jurado, 'as notas de ' + j.jurado); }; });
    [].forEach.call(app.querySelectorAll('.chip[data-j]'), function (b) {
      b.onclick = function () {
        var n = jur[+b.getAttribute('data-j')];
        if (!window.confirm('Excluir ' + n + ' da lista de avaliadores? As notas dessa pessoa também serão apagadas.')) { return; }
        b.disabled = true; b.textContent = 'Aguarde…';
        call('adminJurado', [S.adm, 'remove', n], function (e) { ok(e, n + ' excluído.'); }, function (e) { toast(msg(e)); telaAdmin(est); });
      };
    });
    document.getElementById('admAdd').onclick = function () {
      var n = document.getElementById('admNovo').value.trim(); if (n.length < 3) { toast('Digite o nome completo.'); return; }
      this.disabled = true; this.textContent = 'Aguarde…';
      call('adminJurado', [S.adm, 'add', n], function (e) { ok(e, n + ' incluído.'); }, function (e) { toast(msg(e)); telaAdmin(est); });
    };
    var t = document.getElementById('admTodos'); if (t) { t.onclick = function () { apagar('*', 'os votos de TODOS os jurados'); }; }
    document.getElementById('admSai').onclick = function () { S.adm = ''; start(); };
  }

  function telaCadastro(erro) {
    var h = '<div class="card"><h2>Jurado substituto</h2><div class="ap" style="color:var(--mut)">Digite seu nome completo para entrar na votação.</div>' +
      '<label class="cod">Seu nome<input class="cod" id="nomeNovo" autocomplete="name" autocapitalize="words" maxlength="60" placeholder="Nome e sobrenome"></label>' +
      '<div class="names" style="margin-top:14px"><button class="name" id="ok">Continuar</button></div>' +
      '<button class="link novo" id="voltar">Voltar para a lista</button>';
    if (erro) { h += '<div class="state err">' + esc(erro) + '</div>'; }
    h += '</div>';
    app.innerHTML = h;
    document.getElementById('voltar').onclick = function () { telaNomes(); };
    var campo = document.getElementById('nomeNovo');
    var enviar = function () {
      var nome = campo.value;
      var b = document.getElementById('ok'); b.textContent = 'Cadastrando…'; b.disabled = true;
      call('cadastrarJurado', [nome, S.code], function (n) {
        if (S.init.jurados.indexOf(n) < 0) { S.init.jurados.push(n); }
        entrar(n);
      }, function (e) { telaCadastro(msg(e)); });
    };
    document.getElementById('ok').onclick = enviar;
    campo.onkeydown = function (ev) { if (ev.key === 'Enter') { enviar(); } };
  }

  function telaFechada() {
    app.innerHTML = '<div class="card fechada"><div class="big">Votação encerrada</div><div>Obrigado! Os votos já foram registrados.</div></div><button class="link novo" id="adm" style="opacity:.55;font-size:12px">Administração</button>';
    document.getElementById('adm').onclick = function () { telaAdminLogin(); };
  }

  function entrar(nome) {
    S.juror = nome;
    call('getMeusVotos', [nome, S.code], function (v) {
      S.votes = v || {};
      try { if (!S.init.exigeCodigo) localStorage.setItem(KEY, nome); } catch (e) {}
      telaVotos();
    }, function (e) { try { localStorage.removeItem(KEY); } catch (x) {} telaNomes(msg(e)); });
  }

  function opcoes() {
    var i = S.init, out = [];
    for (var n = i.notaMin; n <= i.notaMax + 1e-9; n += i.passo) { out.push(Math.round(n * 100) / 100); }
    return out;
  }

  function telaVotos() {
    var i = S.init, total = i.projetos.length;
    var feitos = i.projetos.filter(function (p) { return S.votes[p.id] !== undefined; }).length;
    var ops = opcoes();
    var h = '<div class="top"><div class="who">Votando como <b>' + esc(S.juror) + '</b></div><button class="link" id="trocar">Trocar</button></div>';
    h += '<div class="prog"><i style="width:' + Math.round(feitos / total * 100) + '%"></i></div><div class="cnt">' + feitos + ' de ' + total + ' projetos avaliados</div>';
    i.projetos.forEach(function (p) {
      var nota = S.votes[p.id];
      h += '<div class="card" data-id="' + esc(p.id) + '"><h2>' + esc(p.titulo) + '</h2><div class="ap">' + esc(p.apresentador) + '</div><div class="chips">';
      ops.forEach(function (o) {
        h += '<button class="chip' + (nota === o ? ' sel' : '') + '" data-n="' + o + '">' + fmt(o) + '</button>';
      });
      h += '</div><div class="state' + (nota !== undefined ? ' ok' : '') + '">' + (nota !== undefined ? '✔ Nota ' + fmt(nota) + ' gravada' : 'Escolha uma nota') + '</div></div>';
    });
    if (feitos === total) {
      h += '<div class="card done"><div class="big">Obrigado, ' + esc(S.juror.split(' ')[0]) + '!</div><div>Você avaliou todos os projetos.</div><ul class="resumo">' +
        i.projetos.map(function (p) { return '<li><span>' + esc(p.titulo) + '</span><b>' + fmt(S.votes[p.id]) + '</b></li>'; }).join('') + '</ul></div>';
    }
    app.innerHTML = h;
    document.getElementById('trocar').onclick = function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      S.juror = ''; S.votes = {}; telaNomes();
    };
    [].forEach.call(app.querySelectorAll('.chip'), function (b) {
      b.onclick = function () { votar(b.closest('.card').getAttribute('data-id'), parseFloat(b.getAttribute('data-n')), b); };
    });
  }

  function votar(pid, nota, btn) {
    if (S.busy[pid]) { return; }
    S.busy[pid] = true;
    var card = btn.closest('.card'), st = card.querySelector('.state');
    [].forEach.call(card.querySelectorAll('.chip'), function (c) { c.classList.add('busy'); });
    st.className = 'state'; st.textContent = 'Gravando…';
    call('salvarVoto', [S.juror, pid, nota, S.code], function (v) {
      S.busy[pid] = false; S.votes = v || S.votes; var y = window.pageYOffset; telaVotos(); window.scrollTo(0, y);
    }, function (e) {
      S.busy[pid] = false;
      [].forEach.call(card.querySelectorAll('.chip'), function (c) { c.classList.remove('busy'); });
      st.className = 'state err'; st.textContent = msg(e); toast(msg(e));
      if (/encerrada/i.test(msg(e))) { S.init.aberta = false; setTimeout(telaFechada, 1500); }
    });
  }

  start();
})();
</script>
</body>
</html>
